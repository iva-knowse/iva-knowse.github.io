<html>
<head>
    <title>my very own website</title>
    <style>
        * {background-color:black}
        p {
            color:white;
            padding-left:10px;
            padding-top:10px;
        }
        .spin-container {
            perspective: 800px;
            display: inline-block;
            margin-top: 20px;
        }
        .spin-3d {
            animation: spin3d 2s infinite linear;
            transform-style: preserve-3d;
        }
        @keyframes spin3d {
            from {
                transform: rotateY(0deg);
            }
            to {
                transform: rotateY(360deg);
            }
        }
    </style>
</head>
<body>

    <p>hello<br>this is my website<br>i hope you like it as much as i do
    </p>
    <p>heres my buddy breeky</p>
    <div class="spin-container">
        <img src="assets/freeky.png" width="100" class="spin-3d">
    </div>
    <a href="index.html"><br><br>heres my website</a>

</body>
</html>
